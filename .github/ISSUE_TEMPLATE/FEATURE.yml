name: Feature request
description: Propose a small capability around a concrete need.
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: Explain the task and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or tradeoffs if relevant.
    validations:
      required: true
